name: Bug report
description: Report a bug in the aexlo crate, CLI, toolkit, or documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        English or Japanese is welcome. (日本語での記入も歓迎します。)

        If a specific After Effects plugin fails to load, crashes, or hits a missing suite, please use the **Plugin compatibility report** template instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - aexlo (runtime / host API)
        - aexlo-cli (info / inspect / compat / test / bench / render)
        - aexlo-test / aexlo-macros
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (arm64)
        - Windows (x64)
        - Both / Platform-independent
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: aexlo version (or commit SHA) and Rust toolchain version (`rustc --version`).
      placeholder: "e.g., aexlo 0.3.0, rustc 1.99.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal code, command, or `aexlo.toml` snippet to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Relevant stack traces, compiler errors, or command output.
      render: text
    validations:
      required: false
