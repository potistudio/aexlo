[package]
name = "aexlo-harness"
description = "Preset-driven test, bench and preview toolkit for After Effects plugins hosted by aexlo."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }


# After Effects plugins only exist for Windows and macOS; docs.rs builds Linux
# by default.
[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
aexlo = { workspace = true }
libc = "0.2.186"
image = { workspace = true, features = ["png", "exr"] }
mtpng = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
