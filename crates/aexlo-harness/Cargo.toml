[package]
name = "aexlo-harness"
description = "Preset-driven test, bench and preview toolkit for After Effects plugins hosted by aexlo."
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = "https://github.com/potistudio/aexlo-rs"

[dependencies]
aexlo = { workspace = true }
libc = "0.2.186"
image = { version = "0.25.10", default-features = false, features = ["png", "exr"] }
mtpng = "0.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = { version = "1.1.6", features = ["preserve_order"] }
