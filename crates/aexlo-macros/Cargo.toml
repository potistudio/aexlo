[package]
name = "aexlo-macros"
description = "Attribute macros for aexlo (e.g. #[aexlo_test::preview])."
version = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
# Only `aexlo` is published; the tooling is used from git.
publish = false
edition = { workspace = true }
rust-version = { workspace = true }

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.118", features = ["full"] }
quote = "1.0.46"
proc-macro2 = "1.0.106"
