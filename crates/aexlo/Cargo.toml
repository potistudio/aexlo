[package]
name = "aexlo"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Run After Effects plugin without Adobe dependency."
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = ["after-effects", "graphics", "emulator"]
categories = ["emulator"]
readme = "../../README.md"

# After Effects plugins only exist for Windows and macOS; docs.rs builds Linux
# by default.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[features]
# Colored stdout tracing of every suite call (see `core::diagnostics`).
diagnostics = ["dep:chrono", "dep:colored"]
# `#[aexlo::test]` / `#[aexlo::preview]`. `aexlo-test` turns this on, so plugin
# crates get the macros without host applications building `syn`.
macros = ["dep:aexlo-macros"]

[dependencies]
aexlo-macros = { workspace = true, optional = true }
after-effects = { workspace = true }
after-effects-sys = { workspace = true }
bytemuck = "1.25.1"
chrono = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
dlopen2 = "0.8.2"
log = { workspace = true }
rayon = "1.12.0"
thiserror = "2.0.18"

# Metal-backed GPU rendering is macOS-only; plugins that declare
# PF_OutFlag2_SUPPORTS_GPU_RENDER_F32 are driven through it (see `gpu` module).
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"
foreign-types = "0.5"
objc = "0.2.7"

# CUDA-backed GPU rendering on Windows/Linux. `dynamic-loading` dlopens the
# NVIDIA driver at runtime, so building never requires the CUDA toolkit; the
# `cuda-12040` pin selects a conservative driver-API binding set (R550+).
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cudarc = { version = "0.19.8", default-features = false, features = [
	"std",
	"driver",
	"dynamic-loading",
	"cuda-12040",
] }
