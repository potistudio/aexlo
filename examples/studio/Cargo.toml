[package]
name = "studio"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = false
description = "A small compositor for exercising aexlo end to end: layers, shapes, masks, effects and keyframes."

[dependencies]
aexlo = { workspace = true }
ab_glyph = "0.2.32"
anyhow = { workspace = true }
eframe = { workspace = true }
env_logger = { workspace = true }
epaint_default_fonts = "0.35.0"
image = { workspace = true, features = ["png", "jpeg"] }
log = { workspace = true }
rfd = "0.17.2"
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[[bin]]
name = "studio"
path = "src/main.rs"
