[package]
name = "aexlo-probe"
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false
description = "Instrumented AE effect plugin that records host behavior to a JSONL trace."

# `cdylib` is the actual .aex payload (rename the built DLL to .aex).
# `rlib` lets the playground harness drive the same entry point in-process
# via `Host::from_entry_raw` for breakpoint-friendly debugging.
[lib]
name = "aexlo_probe"
crate-type = ["cdylib", "rlib"]

[features]
# Builds the SmartRender variant: a second effect ("Aexlo Probe Smart") that
# declares PF_OutFlag2_SUPPORTS_SMART_RENDER, deep/float color and GPU
# support. Out flags must match the PiPL, so the variant is a separate build,
# not a runtime switch. `playground run --variant smart` builds it into its
# own target dir so the two builds never overwrite each other.
smart = []

[dependencies]
# Same version as the `aexlo` crate, so `after_effects::sys` struct layouts
# match the host exactly. The probe deliberately talks to the raw `sys` ABI -
# it measures the host, not the high-level wrapper.
after-effects = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# Generates and embeds the PiPL resource (Windows: `16000 PiPL` via winres;
# macOS: .rsrc next to the target dir).
pipl = { workspace = true }
