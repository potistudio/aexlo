# Presets over the deliberately misbehaving test effect: each one makes the
# effect fail in a way the toolkit must catch, and isolate.
[plugin]
crate = "."

[defaults]
size  = [64, 48]
input = { generate = "gradient" }
checks = ["finite"]
golden = false
timeout = 2

[[preset]]
name   = "ok"
params = { Gain = { sweep = [0.5, 1.0] } }

[[preset]]
name   = "crashes"
params = { Mode = "Crash" }

[[preset]]
name   = "errors"
params = { Mode = "Error" }

[[preset]]
name    = "hangs"
params  = { Mode = "Hang" }
timeout = 1

[[preset]]
name    = "freezes"
params  = { Mode = "Freeze" }
timeout = 1

[[preset]]
name   = "deep"
depth  = [8, 16, 32]

[[preset]]
name   = "unwritten"
params = { Mode = "Unwritten" }
checks = ["coverage"]

[[preset]]
name   = "random"
params = { Mode = "Random" }
checks = ["deterministic"]

# Strict mode (`--strict`, or `strict = true` here) catches these.
[[preset]]
name   = "overruns"
params = { Mode = "Overrun" }
strict = true

[[preset]]
name   = "leaks"
params = { Mode = "Leak" }
strict = true

[[preset]]
name   = "undeclared"
params = { Mode = "Undeclared" }
strict = true

[[preset]]
name   = "unbalanced"
params = { Mode = "Unbalanced" }
strict = true

[[preset]]
name   = "param_leak"
params = { Mode = "ParamLeak" }
strict = true

[[preset]]
name   = "strict_ok"
strict = true
